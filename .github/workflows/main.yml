name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
      - run: |
          unzip -q charara-tn.zip
          cd charara-tn
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Charara-apk
          path: charara-tn/app/build/outputs/apk/debug/*.apk
